<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Um presente pra você</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,500;1,9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg1:#2a0710; --bg2:#0d0205; --cream:#f4e8d3; --cream2:#e3cfae;
  --red:#d6001c; --gold:#f0c75e; --text:#fbefe0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;height:100%;overflow:hidden;color:var(--text);
  font-family:"Fraunces",Georgia,"Times New Roman",serif;
  background:radial-gradient(120% 80% at 50% 30%,var(--bg1),var(--bg2) 70%);
}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}

/* ---------- Cena 1: presente ---------- */
#s1{transition:opacity .7s ease,transform .7s ease}
#s1.out{opacity:0;transform:scale(1.15);pointer-events:none}
.msg{font-size:clamp(26px,7vw,40px);line-height:1.2;font-weight:500;font-style:italic;max-width:15em;margin:0 0 40px}
.hint{margin:44px 0 0;font-size:clamp(17px,4.6vw,22px);color:var(--gold);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}

.gift{position:relative;width:200px;height:215px;cursor:pointer;border:0;background:none;padding:0;
  animation:wiggle 2.6s ease-in-out infinite;transform-origin:50% 100%}
.gift:focus-visible{outline:3px solid var(--gold);outline-offset:12px;border-radius:12px}
@keyframes wiggle{0%,70%,100%{transform:rotate(0)}74%{transform:rotate(-4deg)}80%{transform:rotate(4deg)}86%{transform:rotate(-3deg)}92%{transform:rotate(2deg)}}
.gift::before{content:"";position:absolute;left:-30px;right:-30px;bottom:-14px;height:26px;border-radius:50%;background:rgba(0,0,0,.55);filter:blur(8px)}
.box{position:absolute;left:0;bottom:0;width:200px;height:145px;border-radius:6px;
  background:linear-gradient(90deg,var(--cream2),var(--cream) 30%,var(--cream) 70%,var(--cream2));box-shadow:inset 0 -18px 28px rgba(120,70,20,.25)}
.box::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:38px;transform:translateX(-50%);background:linear-gradient(90deg,#a10016,var(--red) 40%,#ff3b52 55%,#a10016)}
.lid{position:absolute;left:-10px;top:10px;width:220px;height:66px;border-radius:8px;z-index:2;
  background:linear-gradient(90deg,var(--cream2),var(--cream) 30%,var(--cream) 70%,var(--cream2));box-shadow:0 8px 14px rgba(0,0,0,.35)}
.lid::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:38px;transform:translateX(-50%);background:linear-gradient(90deg,#a10016,var(--red) 40%,#ff3b52 55%,#a10016);border-radius:2px}
.bow{position:absolute;left:50%;top:-34px;width:0;height:0}
.bow i{position:absolute;top:0;width:54px;height:40px;border:12px solid var(--red);border-radius:60% 60% 50% 50%;background:transparent;box-shadow:inset 0 0 6px rgba(0,0,0,.35)}
.bow i:nth-child(1){left:-62px;transform:rotate(-28deg)}
.bow i:nth-child(2){left:8px;transform:rotate(28deg)}
.bow b{position:absolute;left:-13px;top:14px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff5a70,#b00018)}
.burst{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px;border-radius:50%;opacity:0;pointer-events:none;
  background:radial-gradient(circle,#fff6c9 0,rgba(255,214,102,.8) 30%,rgba(255,80,60,0) 70%)}
.gift.open{animation:none;cursor:default}
.gift.open .lid{animation:lidfly 1s cubic-bezier(.3,.1,.4,1) forwards}
.gift.open .box{animation:boxfall .8s .25s ease-in forwards}
.gift.open .burst{animation:burst 1.2s .1s ease-out forwards}
@keyframes lidfly{to{transform:translate(-70px,-300px) rotate(-38deg);opacity:0}}
@keyframes boxfall{to{transform:translateY(40px) scale(.9);opacity:0}}
@keyframes burst{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(14)}}
.conf{position:fixed;left:0;top:0;width:10px;height:16px;z-index:5;pointer-events:none;border-radius:2px}

/* ---------- Cena 2: Ferrari ---------- */
#s2{opacity:0;visibility:hidden;transition:opacity 1s ease}
#s2.on{opacity:1;visibility:visible}
.spot{position:absolute;left:50%;top:48%;width:140vmax;height:70vmax;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side,rgba(255,80,70,.28),rgba(255,60,60,0) 70%);opacity:0}
#s2.on .spot{animation:fadein 2.5s 1.6s forwards}
.floor{position:absolute;left:0;right:0;top:calc(50% + 30px);height:1px;background:linear-gradient(90deg,transparent,rgba(255,200,160,.45),transparent);opacity:0}
#s2.on .floor{animation:fadein 1.5s .6s forwards}
.carwrap{position:relative;width:min(94vw,600px);transform:translateX(-140vw)}
#s2.on .carwrap{animation:drive 2.4s cubic-bezier(.1,.75,.2,1) .5s forwards}
@keyframes drive{to{transform:translateX(0)}}
#s2.on .car{animation:settle .9s 2.9s ease-out both}
@keyframes settle{0%{transform:rotate(0)}35%{transform:rotate(-1.6deg) translateY(2px)}70%{transform:rotate(.6deg)}100%{transform:rotate(0)}}
.car{width:100%;height:auto;display:block;transform-origin:50% 90%;filter:drop-shadow(0 18px 18px rgba(0,0,0,.55))}
.spin{transform-origin:0 0}
#s2.on .spin{animation:spin .2s linear 12 .5s}
@keyframes spin{to{transform:rotate(360deg)}}
.beam{opacity:0}
#s2.on .beam{animation:beam 2.2s 3s ease-out forwards}
@keyframes beam{0%{opacity:0}15%{opacity:.9}25%{opacity:.2}40%,100%{opacity:.85}}
@keyframes fadein{to{opacity:1}}
.model{margin:26px 0 8px;font-size:clamp(14px,3.8vw,17px);color:var(--gold);letter-spacing:.08em;opacity:0}
.big{margin:0;font-size:clamp(30px,8.4vw,52px);line-height:1.12;font-weight:700;font-style:italic;max-width:12em;opacity:0}
.sub{margin:16px 0 0;font-size:clamp(17px,4.6vw,22px);line-height:1.4;max-width:21em;opacity:0}
.love{margin:20px 0 0;font-size:clamp(20px,5.4vw,28px);font-style:italic;color:var(--gold);opacity:0}
#s2.on .model{animation:fadein 1s 3.1s forwards}
#s2.on .big{animation:fadein 1.2s 3.5s forwards}
#s2.on .sub{animation:fadein 1.2s 4.4s forwards}
#s2.on .love{animation:fadein 1.2s 5.4s forwards}
.again{margin-top:26px;font:inherit;font-size:16px;color:var(--text);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);
  padding:12px 22px;border-radius:999px;cursor:pointer;opacity:0}
#s2.on .again{animation:fadein 1s 6.6s forwards}
.again:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.heart{position:fixed;bottom:-30px;z-index:4;pointer-events:none;color:#ff4a63;opacity:0}
@media (prefers-reduced-motion:reduce){.gift{animation:none}.hint{animation:none}}
</style>
</head>
<body>

      <div class="box"></div>
      <div class="lid"><div class="bow"><i></i><i></i><b></b></div></div>
      <div class="burst"></div>
    </button>
    <p class="hint" id="hint">Toque para abrir</p>
  </section>

      o.type='sawtooth'; o2.type='square';
      o.frequency.setValueAtTime(55,t+.6); o.frequency.exponentialRampToValueAtTime(190,t+2.2); o.frequency.exponentialRampToValueAtTime(70,t+3.4);
      o2.frequency.setValueAtTime(27,t+.6); o2.frequency.exponentialRampToValueAtTime(95,t+2.2); o2.frequency.exponentialRampToValueAtTime(35,t+3.4);
      f.type='lowpass'; f.frequency.value=700;
      g.gain.setValueAtTime(0,t+.5); g.gain.linearRampToValueAtTime(.16,t+1.6); g.gain.linearRampToValueAtTime(0,t+3.6);
      o.connect(f); o2.connect(f); f.connect(g); g.connect(c.destination);
      o.start(t+.5); o2.start(t+.5); o.stop(t+3.7); o2.stop(t+3.7);
    }catch(e){}
  }

  function confetti(){
    var r=gift.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
    for(var i=0;i<70;i++){
      var d=document.createElement('div'); d.className='conf';
      d.style.background=colors[i%colors.length];
      d.style.left=cx+'px'; d.style.top=cy+'px';
      document.body.appendChild(d);
      var a=Math.random()*Math.PI*2, v=120+Math.random()*260;
      var dx=Math.cos(a)*v, dy=Math.sin(a)*v-180, rot=Math.random()*900-450;
      var an=d.animate([
        {transform:'translate(0,0) rotate(0)',opacity:1},
        {transform:'translate('+dx+'px,'+dy+'px) rotate('+rot/2+'deg)',opacity:1,offset:.45},
        {transform:'translate('+(dx*1.25)+'px,'+(dy+420)+'px) rotate('+rot+'deg)',opacity:0}
      ],{duration:1800+Math.random()*1200,easing:'cubic-bezier(.2,.6,.4,1)',fill:'forwards'});
      an.onfinish=(function(el){return function(){el.remove()}})(d);
    }
  }

  function hearts(){
    clearInterval(heartTimer);
    heartTimer=setInterval(function(){
      var h=document.createElement('div'); h.className='heart'; h.textContent='❤';
      h.style.left=(Math.random()*95)+'vw'; h.style.fontSize=(14+Math.random()*22)+'px';
      document.body.appendChild(h);
      var an=h.animate([
        {transform:'translateY(0) scale(.6)',opacity:0},
        {opacity:.8,offset:.2},
        {transform:'translateY(-'+(60+Math.random()*50)+'vh) translateX('+(Math.random()*60-30)+'px) scale(1.1)',opacity:0}
      ],{duration:4500+Math.random()*2500,easing:'ease-out',fill:'forwards'});
      an.onfinish=function(){h.remove()};
    },650);
  }

  function open(){
    if(opened) return; opened=true;
    gift.classList.add('open'); hint.style.opacity=0; hint.style.animation='none';
    confetti();
    if(navigator.vibrate){try{navigator.vibrate(60)}catch(e){}}
    setTimeout(function(){ s1.classList.add('out'); },1100);
    setTimeout(function(){ s2.classList.add('on'); engine(); },1500);
    setTimeout(hearts,6000);
  }

  function reset(){
    clearInterval(heartTimer);
    s2.classList.remove('on');
    setTimeout(function(){
      gift.classList.remove('open'); s1.classList.remove('out');
      hint.style.opacity=''; hint.style.animation=''; opened=false;
    },1000);
  }

  gift.addEventListener('click',open);
  document.getElementById('again').addEventListener('click',reset);
})();
</script>
</body>
</html>
